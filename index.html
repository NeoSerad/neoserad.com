<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <!-- Cover the page immediately if arriving via #work so the instant
       scroll-to-grid is invisible. Reads localStorage for the correct
       background colour before the stylesheet has even parsed. -->
  <script>if(location.hash==='#work'){var _t=localStorage.getItem('theme')||'dark';var _ol=document.createElement('div');_ol.id='page-overlay';_ol.style.cssText='position:fixed;inset:0;z-index:9998;background:'+(_t==='dark'?'#071610':'#FCFFF2');document.documentElement.appendChild(_ol);}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neoserad — Motion Graphics</title>
  <meta name="description" content="Motion graphics portfolio of Neoserad." />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- GSAP via CDN — loads the core library plus ScrollTrigger plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js" defer></script>

  <!-- Page script — deferred so it runs after the DOM is ready -->
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- ============================================================
       CUSTOM CURSOR
       A small dot that follows the mouse. Styled in CSS,
       moved by GSAP in main.js for smooth lag-free tracking.
       ============================================================ -->
  <div class="cursor" id="cursor"></div>


  <!-- ============================================================
       SHOWREEL
       ============================================================ -->
  <section class="reel" id="reel" aria-label="Showreel">
    <video
      class="reel__video"
      src="https://file.garden/afmGk3tutzpQHcjJ/8mb.video-Rda-mFODh7sF.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>
    <div class="reel__overlay" aria-hidden="true"></div>
    <div class="reel__fade" aria-hidden="true"></div>
    <div class="reel__cue" id="reel-cue" aria-hidden="true">
      <span class="reel__cue-line"></span>
      <span class="reel__cue-arrow"></span>
    </div>
  </section>


  <!-- ============================================================
       NAVIGATION
       Fixed to the top. Becomes bordered once the user scrolls
       (the .scrolled class is toggled by main.js).
       ============================================================ -->
  <nav class="nav" id="nav">
    <div class="nav__inner container">

      <!-- Wordmark — swap this for an <img> when the logo is ready -->
      <a href="/" class="nav__logo">Neoserad</a>

      <ul class="nav__links">
        <li><a href="#work" class="nav__link active">Work</a></li>
        <li><a href="about.html" class="nav__link">About</a></li>
        <!-- Theme toggle — icon swaps between ☀ and ☾ via JS -->
        <li><button class="nav__toggle" id="theme-toggle" aria-label="Toggle light/dark mode">☾</button></li>
      </ul>

    </div>
  </nav>


  <!-- ============================================================
       MAIN CONTENT
       .page adds top padding equal to the nav height so
       content doesn't sit behind the fixed nav.
       ============================================================ -->
  <main class="page">


    <!-- ----------------------------------------------------------
         HERO
         Deliberately sparse — a heading and a descriptor.
         GSAP fades and slides these in on page load in main.js.
         ---------------------------------------------------------- -->
    <section class="hero section container">
      <p class="label hero__label">Hey! I'm Neo.</p>
      <h1 class="hero__heading">Making pixels <span class="wiggle-word"><span class="wiggle-letter">m</span><span class="wiggle-letter">o</span><span class="wiggle-letter">v</span><span class="wiggle-letter">e</span></span> and having fun along the way.</h1>
    </section>


    <!-- ----------------------------------------------------------
         SHOWREEL EMBED
         ---------------------------------------------------------- -->
    <section class="project-embed-section container" id="landing-embed">
      <p class="reel-embed__label">View my 2026 showreel here!</p>
      <div class="project-embed">

        <iframe
          src="https://player.mediadelivery.net/embed/679895/28f4c5eb-1b88-4fe6-b276-322da685da3f?autoplay=false&loop=true&muted=false&preload=true&responsive=true"
          loading="lazy"
          allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen"
          allowfullscreen
        ></iframe>
      </div>
    </section>


    <!-- ----------------------------------------------------------
         PROJECT GRID
         Each .card links to its own project page.
         Cards start invisible (opacity: 0 in CSS) and are
         animated in by GSAP ScrollTrigger as they enter the viewport.

         TO ADD A REAL PROJECT:
         1. Duplicate a .card block
         2. Replace the placeholder <div class="card__media"> with
            an <img> or leave as-is and update the background-image
         3. Update the title, category label, and href
         ---------------------------------------------------------- -->
    <section class="grid-section section" id="work">

      <!-- Row label -->
      <p class="label grid__label container">Selected work</p>

      <div class="grid" id="project-grid">

        <!-- Card 1 -->
        <a href="projects/Persona/persona.html" class="card" data-cursor="view">
          <img class="card__media" src="images/project_media/Persona/persona_thumbnail.png" alt="Persona - Y2K PSX Racer">
          <div class="card__info">
            <div>
              <p class="label">Assignment · 2025</p>
              <p class="card__title">Persona - Y2K PSX Racer</p>
            </div>
            <span class="card__arrow">↗</span>
          </div>
        </a>

        <!-- Card 2 -->
        <a href="projects/Authentics/authentics.html" class="card" data-cursor="view">
          <img class="card__media" src="images/project_media/Authentics/authentics_thumbnail.png" alt="Authentics - 2 for $80">
          <div class="card__info">
            <div>
              <p class="label">Spec work · 2026</p>
              <p class="card__title">Authentics - 2 for $80</p>
            </div>
            <span class="card__arrow">↗</span>
          </div>
        </a>

        <!-- Card 3 -->
        <a href="projects/Sensorium/sensorium.html" class="card" data-cursor="view">
          <img class="card__media" src="images/project_media/Sensorium/sensorium_thumbnail.png" alt="Sensorium - Parallax Animation">
          <div class="card__info">
            <div>
              <p class="label">Assignment · 2025</p>
              <p class="card__title">Sensorium</p>
            </div>
            <span class="card__arrow">↗</span>
          </div>
        </a>


      </div><!-- /grid -->
    </section>


  </main>


  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="footer container">
    <p class="footer__copy">© 2026 Neoserad</p>
    <div class="footer__icons">
      <a href="https://www.linkedin.com/in/neo-serad/" class="footer__icon" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.45 20.45h-3.554v-5.569c0-1.328-.024-3.037-1.85-3.037-1.851 0-2.135 1.445-2.135 2.939v5.667H9.356V9h3.413v1.561h.047c.476-.9 1.637-1.85 3.37-1.85 3.602 0 4.267 2.372 4.267 5.455v6.284zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:neoserad@gmail.com?subject=Hey%20Neo!%20-%20Motion%20Design" class="footer__icon" aria-label="Email">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
    <p class="footer__copy">Melbourne, AU</p>
  </footer>


</body>
</html>
